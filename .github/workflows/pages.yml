name: Tests and GitHub Pages deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, server and e2e tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4.2.3
        with:
          path: /home/runner/pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Server (Apps Script) tests
        run: npm run test:server

      - name: Frontend unit tests
        run: npm run test:unit

      - name: E2E against local contract-mock
        run: npm run test:e2e

  build:
    name: Build and privacy scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Публичный URL Apps Script — Variables, не Secrets (это не секрет).
      - name: Build Astro site
        env:
          PUBLIC_APPS_SCRIPT_URL: ${{ vars.PUBLIC_APPS_SCRIPT_URL }}
        run: npm run build

      - name: Upload dist for privacy scan artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist-privacy-scan
          path: dist
          retention-days: 1

      - name: Privacy scan of dist
        run: npm run test:dist-privacy

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          PUBLIC_APPS_SCRIPT_URL: ${{ vars.PUBLIC_APPS_SCRIPT_URL }}
        run: npm run build

      - name: Privacy scan before publish
        run: npm run test:dist-privacy

      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact (только dist)
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
